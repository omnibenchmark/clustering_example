id: omni-clustbench-conda
description: "Clustering benchmark on Gagolewski's, true number of clusters plus minus 2."
version: "1.5.0"
api_version: "0.8.0"
benchmarker: "Izaskun Mallona, Daniel Incicau, Ben Carrillo, Mark Robinson"
storage:
  api: S3
  endpoint: http://omnibenchmark.mls.uzh.ch:9000
  bucket_name: clusteringexampleconda
software_backend: conda
software_environments:
  clustbench:
    description: "clustbench on py3.12.6"
    conda: envs/clustbench.yml
  fcps:
    description: "CRAN's FCPS"
    conda: envs/fcps.yml
  quarto:
    description: "quarto and the R packages reports/report.Rmd loads"
    conda: envs/quarto.yml
stages:
  ## clustbench data ##########################################################

  - id: data
    modules:
      - id: clustbench
        name: "clustbench datasets, from https://www.sciencedirect.com/science/article/pii/S0020025521010082#t0005 Table1"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-data
          commit: e7e4750
        parameters:  # comments depict the possible cardinalities and the number of curated labelsets
          - dataset_generator: "fcps"
            dataset_name: ["atom", "chainlink", "engytime", "hepta", "lsun", "target", "tetra", "twodiamonds", "wingnut"]
          - dataset_generator: "graves"
            dataset_name: ["dense", "fuzzyx", "line", "parabolic", "ring", "ring_noisy", "ring_outliers", "zigzag", "zigzag_noisy", "zigzag_outliers"] 
          - dataset_generator: "other"
            dataset_name: ["chameleon_t4_8k", "chameleon_t5_8k", "hdbscan", "iris", "iris5", "square"]
          - dataset_generator: "sipu"
            dataset_name: ["aggregation", "compound", "flame", "jain", "pathbased", "r15", "spiral", "unbalance"]
          - dataset_generator: "uci"
            dataset_name: ["ecoli", "ionosphere", "sonar", "statlog", "wdbc", "wine", "yeast"]
          - dataset_generator: "wut"
            dataset_name: ["circles", "cross", "graph", "isolation", "labirynth", "mk1", "mk2", "mk3", "mk4", "olympic", "smile", "stripes", "trajectories", "trapped_lovers", "twosplashes", "windows", "x1", "x2", "x3", "z1", "z2", "z3"]
    outputs:
      - id: data_matrix
        path: "data.gz"
      - id: data_true_labels
        path: "labels0.gz"

  ## clustbench methods (fastcluster) ###################################################################

  - id: clustering
    modules:
      - id: fastcluster
        name: "fastcluster algorithm"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-fastcluster
          commit: 414d92f
        parameters:
          - linkage: ["complete", "ward", "average", "weighted", "median", "centroid"]
      - id: sklearn
        name: "sklearn"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-sklearn
          commit: 43c7e22
        parameters:
          - method: ["birch", "kmeans", "gm"]
          # "spectral" ## too slow
      - id: agglomerative
        name: "agglomerative"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-agglomerative
          commit: fd0dbae
        parameters:
          - linkage: ["average", "complete", "ward"]
      - id: genieclust
        name: "genieclust"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-genieclust
          commit: 24539e3
        parameters:
          - method: "genie"
            gini_threshold: 0.5
          - method: ["gic", "ica"]
      - id: fcps
        name: "fcps"
        software_environment: "fcps"
        repository:
          url: /home/b/lab/clustbench08/clustbench-fcps
          commit: a81079e
        parameters:
          - method: ["FCPS_Minimax", "FCPS_MinEnergy", "FCPS_HDBSCAN_2", "FCPS_HDBSCAN_4", "FCPS_HDBSCAN_8", "FCPS_Diana", "FCPS_Fanny", "FCPS_Hardcl", "FCPS_Softcl", "FCPS_Clara", "FCPS_PAM"]
            seed: 2
          # - "FCPS_AdaptiveDensityPeak" # not in Conda
    inputs:
        - data_matrix
        - data_true_labels
    outputs:
      - id: clustering_predicted_ks_range
        path: "ks_range.labels.gz"

  - id: metrics
    modules:
      - id: partition_metrics
        name: "clustbench partition metrics"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-metrics
          commit: 349d092
        parameters:
          - metric: ["normalized_clustering_accuracy", "adjusted_fm_score", "adjusted_rand_score"]
          # - "adjusted_mi_score"
          # - "adjusted_rand_score"
          # - "fm_score"
          # - "mi_score"
          # - "normalized_clustering_accuracy"
          # - "normalized_mi_score"
          # - "normalized_pivoted_accuracy"
          # - "pair_sets_index"
          # - "rand_score"
    inputs:
        - clustering_predicted_ks_range
        - data_true_labels
    outputs:
      - id: metrics_scores
        path: "scores.gz"

  ## one tidy table of scores per dataset #####################################

  - id: metrics_summary
    gather:
      from: metrics_scores
      group_by: data
    modules:
      - id: summary
        name: "scores of one dataset, labelled from the lineage"
        software_environment: "clustbench"
        repository:
          url: /home/b/lab/clustbench08/clustbench-metrics
          commit: 349d092
          entrypoint: summary
    outputs:
      - id: metrics_summary
        path: "summary.tsv"

  ## one report over every dataset (was: the `plotting` metric collector) ######

  - id: report
    gather:
      from: metrics_summary
      path: report                      # out/report/, no hash in the path
    modules:
      - id: quarto
        name: "clustering metrics report"
        software_environment: "quarto"
        repository:
          url: /home/b/lab/omni-quarto-report
          commit: 3218ef8
        parameters:
          - template: reports/report.Rmd   # in this repository
    outputs:
      - id: report_html
        path: "report.html"
