        path: "{dataset}.labels0.gz"

  ## clustbench methods (fastcluster) ###################################################################

  - id: clustering
    modules:
      - id: fastcluster
        name: "fastcluster algorithm"
        software_environment: "clustbench"
        repository:
          url: https://github.com/imallona/clustbench_fastcluster
          commit: e644ce5
        parameters:
          - linkage: "complete"
          #- linkage: ["ward", "average", "weighted", "median", "centroid"]
      - id: sklearn
        name: "sklearn"
        software_environment: "clustbench"
        repository:
          url: https://github.com/imallona/clustbench_sklearn
          commit: dcf35e1
        parameters:
          - method: "birch"
          # ["kmeans, "gm"]
          # ["spectral"] ## too slow
      - id: agglomerative
        name: "agglomerative"
        software_environment: "clustbench"
        repository:
          url: https://github.com/imallona/clustbench_agglomerative
          commit: 9d086a9
        parameters:
          - linkage: "average"
          # ["complete", "ward"]
      - id: genieclust
        name: "genieclust"
        software_environment: "clustbench"
        repository:
          url: https://github.com/imallona/clustbench_genieclust
          commit: 7d9e799
        parameters:
          - method: "genie"
            # method: ["gic", "ica"]
            gini_threshold: 0.5
      - id: fcps
        name: "fcps"
        software_environment: "fcps"
        repository:
          url: https://github.com/imallona/clustbench_fcps
          commit: e780fed
        parameters:
          - method: "FCPS_Minimax"
            seed: 2
          # - "FCPS_AdaptiveDensityPeak" # not in Conda
          # - "FCPS_MinEnergy",
          # - "FCPS_HDBSCAN_2",
          # - "FCPS_HDBSCAN_4",
          # - "FCPS_HDBSCAN_8",
          # - "FCPS_Diana",
          # - "FCPS_Fanny",
          # - "FCPS_Hardcl",
          # - "FCPS_Softcl",
          # - "FCPS_Clara",
          # - "FCPS_PAM"
    inputs:
        - data.matrix
        - data.true_labels
    outputs:
      - id: clustering.predicted_ks_range
        path: "{dataset}_ks_range.labels.gz"

  - id: metrics
    modules:
      - id: partition_metrics
        name: "clustbench partition metrics"
        software_environment: "clustbench"
        repository:
          url: https://github.com/imallona/clustbench_metrics
          commit: c4eda85
        parameters:
          - metric: ["normalized_clustering_accuracy", "adjusted_fm_score"]
          # - "adjusted_mi_score"
          # - "adjusted_rand_score"
          # - "fm_score"
          # - "mi_score"
          # - "normalized_clustering_accuracy"
          # - "normalized_mi_score"
          # - "normalized_pivoted_accuracy"
          # - "pair_sets_index"
          # - "rand_score"
    inputs:
        - clustering.predicted_ks_range
        - data.true_labels
    outputs:
      - id: metrics.scores
        path: "{dataset}.scores.gz"
