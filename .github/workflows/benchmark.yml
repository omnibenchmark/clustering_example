name: Run Benchmark
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  run-benchmark:
    name: Run Benchmark
    permissions: write-all

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install omnibenchmark CLI
        run: |
          pip install git+https://github.com/omnibenchmark/omnibenchmark.git@dev

      - name: Load benchmark cache
        id: cache-benchmark
        uses: actions/cache@v3
        with:
          path: out/
          key: benchmark-${{ runner.os }}-${{ hashFiles('Clustering.yaml') }}

      - name: Run benchmark
        run: |
          ob run benchmark -b Clustering.yaml --local --threads 20

  download-artifact:
    name: Download Benchmark Output
    runs-on: ubuntu-latest
    needs: run-benchmark
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load cached output
        uses: actions/cache@v3
        with:
          path: out/
          key: benchmark-${{ runner.os }}-${{ hashFiles('Clustering.yaml') }}

      - name: Zip output folder
        run: |
          zip -r benchmark_output.zip out/

      - name: Upload zipped output
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-output-zip
          path: benchmark_output.zip
          retention-days: 7
    
